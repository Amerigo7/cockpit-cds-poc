databases:
  - name: cockpit-cds-poc-db
    plan: free
    region: frankfurt
    ipAllowList: []
services:
  - type: web
    name: cockpit-cds-partage
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run check && npm test
    startCommand: npm run start:shared
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cockpit-cds-poc-db
          property: connectionString
      - key: LAURENT_PASSWORD
        sync: false
      - key: JENNIFER_PASSWORD
        sync: false
      - key: LASSAAD_PASSWORD
        sync: false
